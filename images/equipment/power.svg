<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pwrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="pwrGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#pwrBg)"/>
  <!-- Auxiliary Power Bus & Power Unit Generator Module -->
  <g transform="translate(70, 50)">
    <!-- Heavy-Duty Module Body -->
    <rect x="20" y="20" width="220" height="135" rx="14" fill="#0E233A" stroke="#2563EB" stroke-width="2.5"/>
    <!-- Cooling Fin Array on Top and Side -->
    <g stroke="#38BDF8" stroke-width="2" opacity="0.7">
      <line x1="40" y1="12" x2="40" y2="20"/>
      <line x1="60" y1="12" x2="60" y2="20"/>
      <line x1="80" y1="12" x2="80" y2="20"/>
      <line x1="100" y1="12" x2="100" y2="20"/>
      <line x1="120" y1="12" x2="120" y2="20"/>
      <line x1="140" y1="12" x2="140" y2="20"/>
      <line x1="160" y1="12" x2="160" y2="20"/>
      <line x1="180" y1="12" x2="180" y2="20"/>
      <line x1="200" y1="12" x2="200" y2="20"/>
      <line x1="220" y1="12" x2="220" y2="20"/>
    </g>
    <!-- Solid State Power Transformer Core -->
    <rect x="40" y="38" width="100" height="70" rx="8" fill="#071524" stroke="#D97706" stroke-width="2"/>
    <!-- Lightning Bolt / Energy Icon -->
    <polygon points="90,48 76,73 91,73 85,98 106,70 93,70" fill="#D97706"/>
    <!-- Voltage and Current Meter Indicators -->
    <g transform="translate(155, 38)">
      <rect x="0" y="0" width="70" height="30" rx="6" fill="#071524" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="35" y="15" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">115V / 400Hz</text>
      <text x="35" y="26" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">NOMINAL</text>
      <rect x="0" y="40" width="70" height="30" rx="6" fill="#071524" stroke="#059669" stroke-width="1.5"/>
      <text x="35" y="55" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">BUS A+B LINK</text>
      <text x="35" y="66" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">90 kVA PEAK</text>
    </g>
    <!-- Heavy Duty High-Current Terminal Lugs -->
    <g transform="translate(40, 120)">
      <circle cx="20" cy="16" r="10" fill="#172B45" stroke="#D97706" stroke-width="2"/>
      <circle cx="20" cy="16" r="4" fill="#D97706"/>
      <circle cx="60" cy="16" r="10" fill="#172B45" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="60" cy="16" r="4" fill="#38BDF8"/>
      <circle cx="100" cy="16" r="10" fill="#172B45" stroke="#059669" stroke-width="2"/>
      <circle cx="100" cy="16" r="4" fill="#059669"/>
      <rect x="130" y="8" width="80" height="16" rx="4" fill="#071524" stroke="#1E3A8A" stroke-width="1"/>
      <text x="170" y="20" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">3-PHASE APU BUS</text>
    </g>
  </g>
  <!-- Label -->
  <rect x="110" y="222" width="180" height="22" rx="11" fill="#0F2942" stroke="#2563EB" stroke-width="1"/>
  <text x="200" y="237" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">AUXILIARY POWER BUS</text>
</svg>
