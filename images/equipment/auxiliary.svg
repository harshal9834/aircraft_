<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="auxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="pylonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334E68"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#auxBg)"/>
  <!-- Heavy Duty Aerodynamic Pylon Carrier -->
  <g transform="translate(60, 50)">
    <!-- Upper Wing Hardpoint Interface Bracket -->
    <rect x="50" y="20" width="180" height="18" rx="4" fill="#0A1828" stroke="#38BDF8" stroke-width="1.8"/>
    <circle cx="70" cy="29" r="4" fill="#E2E8F0"/>
    <circle cx="110" cy="29" r="4" fill="#E2E8F0"/>
    <circle cx="170" cy="29" r="4" fill="#E2E8F0"/>
    <circle cx="210" cy="29" r="4" fill="#E2E8F0"/>
    <!-- Swept Aerodynamic Pylon Structure -->
    <polygon points="55,38 225,38 210,110 75,110" fill="url(#pylonGrad)" stroke="#2563EB" stroke-width="2"/>
    <!-- Dual Ejector Release Units (ERU) Hooks -->
    <rect x="90" y="110" width="30" height="15" rx="3" fill="#172B45" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="105" cy="120" r="4" fill="#D97706"/>
    <rect x="160" y="110" width="30" height="15" rx="3" fill="#172B45" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="175" cy="120" r="4" fill="#D97706"/>
    <!-- Umbilical Data Harness Conduit -->
    <path d="M 65,38 Q 65,95 85,115" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85" cy="115" r="3.5" fill="#059669"/>
    <!-- Panel Inspection Stamp & Stencil -->
    <text x="140" y="75" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MIL-STD-1760 DUAL BUS</text>
    <text x="140" y="90" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">MAX PAYLOAD: 3,500 KG</text>
    <!-- Sway Braces -->
    <line x1="85" y1="95" x2="70" y2="125" stroke="#E2E8F0" stroke-width="2.5"/>
    <circle cx="70" cy="125" r="3" fill="#38BDF8"/>
    <line x1="195" y1="95" x2="210" y2="125" stroke="#E2E8F0" stroke-width="2.5"/>
    <circle cx="210" cy="125" r="3" fill="#38BDF8"/>
  </g>
  <!-- Label -->
  <rect x="110" y="222" width="180" height="22" rx="11" fill="#0F2942" stroke="#2563EB" stroke-width="1"/>
  <text x="200" y="237" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">PYLON &amp; CARRIER STORES</text>
</svg>
