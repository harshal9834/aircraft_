<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="suBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="suBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334E68"/>
      <stop offset="40%" stop-color="#486581"/>
      <stop offset="70%" stop-color="#243B53"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="canopyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="400" height="240" rx="16" fill="url(#suBg)"/>
  
  <!-- Grid Reticle Overlay -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="20" y1="120" x2="380" y2="120" stroke-dasharray="4 6"/>
    <line x1="200" y1="20" x2="200" y2="220" stroke-dasharray="4 6"/>
    <circle cx="200" cy="120" r="60" fill="none"/>
    <circle cx="200" cy="120" r="90" fill="none"/>
  </g>

  <!-- Afterburner Plumes -->
  <ellipse cx="68" cy="108" rx="22" ry="7" fill="url(#flame)"/>
  <ellipse cx="68" cy="132" rx="22" ry="7" fill="url(#flame)"/>

  <!-- Su-30MKI Airframe Silhouette Top View -->
  <g transform="translate(10, 0)">
    <!-- Wings Swept -->
    <path d="M 120 120 L 170 60 L 220 110 L 250 116 L 250 124 L 220 130 L 170 180 Z" fill="url(#suBody)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Wing extensions & leading edges -->
    <polygon points="170,60 210,68 250,116 230,116" fill="#243B53" stroke="#627D98" stroke-width="1"/>
    <polygon points="170,180 210,172 250,124 230,124" fill="#243B53" stroke="#627D98" stroke-width="1"/>

    <!-- Wingtip Missiles (R-73 / Astra) -->
    <rect x="160" y="58" width="24" height="4" rx="2" fill="#E2E8F0" stroke="#0F2942" stroke-width="0.8"/>
    <rect x="160" y="178" width="24" height="4" rx="2" fill="#E2E8F0" stroke="#0F2942" stroke-width="0.8"/>

    <!-- Twin Engine Nacelles -->
    <rect x="80" y="100" width="105" height="16" rx="4" fill="#102A43" stroke="#627D98" stroke-width="1.2"/>
    <rect x="80" y="124" width="105" height="16" rx="4" fill="#102A43" stroke="#627D98" stroke-width="1.2"/>
    
    <!-- Twin Vertical Stabilizers (Canted Tails) -->
    <polygon points="90,95 125,75 145,100" fill="#334E68" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="90,145 125,165 145,140" fill="#334E68" stroke="#38BDF8" stroke-width="1.2"/>

    <!-- Horizontal Stabilators / Canards -->
    <polygon points="75,100 95,85 110,100" fill="#486581"/>
    <polygon points="75,140 95,155 110,140" fill="#486581"/>
    <polygon points="265,108 280,94 285,112" fill="#486581" stroke="#38BDF8" stroke-width="1"/>
    <polygon points="265,132 280,146 285,128" fill="#486581" stroke="#38BDF8" stroke-width="1"/>

    <!-- Main Fuselage & Radome Nosecone -->
    <path d="M 85 115 L 180 112 L 270 114 L 335 120 L 270 126 L 180 128 L 85 125 Z" fill="url(#suBody)" stroke="#627D98" stroke-width="1.5"/>
    <polygon points="310,118 348,120 310,122" fill="#102A43" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Tandem Two-Seat Cockpit Canopy -->
    <ellipse cx="265" cy="120" rx="22" ry="6" fill="url(#canopyGlass)" stroke="#BAE6FD" stroke-width="1.2"/>

    <!-- IAF Roundel / Fin Flash on Wing -->
    <g transform="translate(190, 85) scale(0.65)">
      <circle cx="10" cy="10" r="10" fill="#FF9933"/>
      <circle cx="10" cy="10" r="6.6" fill="#FFFFFF"/>
      <circle cx="10" cy="10" r="3.3" fill="#138808"/>
    </g>
  </g>

  <!-- Technical Telemetry Badges -->
  <text x="24" y="36" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">SU-30MKI // FLANKER-H</text>
  <text x="24" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Air Dominance • Twin AL-31FP Thrust Vector</text>

  <g transform="translate(290, 24)">
    <rect width="86" height="20" rx="4" fill="#0F2942" stroke="#38BDF8" stroke-width="1"/>
    <text x="43" y="14" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">MACH 2.0+ CAP</text>
  </g>
</svg>
