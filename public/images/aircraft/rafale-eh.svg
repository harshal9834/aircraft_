<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="rafaleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="rafaleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334E68"/>
      <stop offset="50%" stop-color="#46617C"/>
      <stop offset="100%" stop-color="#1B2D40"/>
    </linearGradient>
    <linearGradient id="canopyGlassRafale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="rafaleFlame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Canvas -->
  <rect width="400" height="240" rx="16" fill="url(#rafaleBg)"/>

  <!-- Tactical Reticle -->
  <g opacity="0.15" stroke="#059669" stroke-width="1">
    <line x1="20" y1="120" x2="380" y2="120" stroke-dasharray="4 6"/>
    <line x1="210" y1="20" x2="210" y2="220" stroke-dasharray="4 6"/>
    <circle cx="210" cy="120" r="70" fill="none"/>
  </g>

  <!-- Twin M88 Afterburners -->
  <ellipse cx="80" cy="113" rx="20" ry="6" fill="url(#rafaleFlame)"/>
  <ellipse cx="80" cy="127" rx="20" ry="6" fill="url(#rafaleFlame)"/>

  <!-- Dassault Rafale EH Silhouette (Cropped Delta + Close-coupled Canards) -->
  <g transform="translate(10, 0)">
    <!-- Cropped Delta Wings with Forward Extension -->
    <path d="M 100 120 L 140 50 L 180 50 L 230 112 L 255 116 L 255 124 L 230 128 L 180 190 L 140 190 Z" fill="url(#rafaleBody)" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Wingtip Rails (Meteor / MICA Missiles) -->
    <rect x="140" y="48" width="35" height="3.5" rx="1.5" fill="#E2E8F0" stroke="#0F2942" stroke-width="0.8"/>
    <rect x="140" y="188" width="35" height="3.5" rx="1.5" fill="#E2E8F0" stroke="#0F2942" stroke-width="0.8"/>

    <!-- Close-Coupled Active Canards (Foreplanes) -->
    <polygon points="230,112 255,90 262,112" fill="#46617C" stroke="#38BDF8" stroke-width="1"/>
    <polygon points="230,128 255,150 262,128" fill="#46617C" stroke="#38BDF8" stroke-width="1"/>

    <!-- Single Swept Vertical Fin with SPECTRA EW Housing -->
    <polygon points="95,116 130,114 145,120 130,126 95,124" fill="#1B2D40" stroke="#627D98" stroke-width="1.5"/>
    <rect x="110" y="117" width="22" height="6" rx="2" fill="#334E68" stroke="#38BDF8" stroke-width="0.8"/>

    <!-- Fuselage, Chined Nose & Inflight Refuel Probe -->
    <path d="M 90 114 L 160 112 L 250 114 L 325 120 L 250 126 L 160 128 L 90 126 Z" fill="url(#rafaleBody)" stroke="#627D98" stroke-width="1.5"/>
    <polygon points="305,118 340,120 305,122" fill="#102A43" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Fixed IFR Probe -->
    <line x1="285" y1="116" x2="315" y2="114" stroke="#94A3B8" stroke-width="2"/>

    <!-- Single Cockpit Bubble Canopy -->
    <ellipse cx="260" cy="120" rx="18" ry="5.5" fill="url(#canopyGlassRafale)" stroke="#BAE6FD" stroke-width="1.2"/>

    <!-- IAF Roundel -->
    <g transform="translate(170, 85) scale(0.6)">
      <circle cx="10" cy="10" r="10" fill="#FF9933"/>
      <circle cx="10" cy="10" r="6.6" fill="#FFFFFF"/>
      <circle cx="10" cy="10" r="3.3" fill="#138808"/>
    </g>
  </g>

  <!-- Technical Telemetry Badges -->
  <text x="24" y="36" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">RAFALE-EH // OMNIROLE</text>
  <text x="24" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Air Dominance • SPECTRA EW Suite • SCALP / METEOR</text>

  <g transform="translate(290, 24)">
    <rect width="86" height="20" rx="4" fill="#0F2942" stroke="#059669" stroke-width="1"/>
    <text x="43" y="14" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">ACTIVE QRA READY</text>
  </g>
</svg>
