<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="sensorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="podBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334E68"/>
      <stop offset="50%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#001428"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#sensorBg)"/>
  <!-- Aerodynamic Pod Body Structure -->
  <g transform="translate(60, 70)">
    <!-- Main Pod Cylindrical Fairing -->
    <rect x="70" y="30" width="180" height="60" rx="6" fill="url(#podBody)" stroke="#2563EB" stroke-width="2"/>
    <!-- Rear Fin Stabilizer -->
    <polygon points="250,30 280,10 270,30" fill="#334E68" stroke="#2563EB" stroke-width="1.5"/>
    <polygon points="250,90 280,110 270,90" fill="#334E68" stroke="#2563EB" stroke-width="1.5"/>
    <!-- Pylon Mount Lugs -->
    <rect x="110" y="16" width="30" height="14" rx="2" fill="#0C2037" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="180" y="16" width="30" height="14" rx="2" fill="#0C2037" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Forward Gimbal Turret Sphere -->
    <circle cx="70" cy="60" r="38" fill="#172B45" stroke="#38BDF8" stroke-width="2"/>
    <!-- Optical Aperture Glass -->
    <ellipse cx="60" cy="60" rx="22" ry="26" fill="url(#lensGlow)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Inner Lens Reflections -->
    <ellipse cx="56" cy="54" rx="10" ry="12" fill="#38BDF8" opacity="0.6"/>
    <circle cx="52" cy="50" r="4" fill="#FFFFFF" opacity="0.85"/>
    <!-- Laser Rangefinder / Designator Window -->
    <circle cx="76" cy="42" r="7" fill="#059669" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="76" cy="42" r="2.5" fill="#FFFFFF"/>
    <!-- FLIR Thermal Aperture Window -->
    <rect x="68" y="72" width="16" height="12" rx="3" fill="#08182B" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="76" cy="78" r="3" fill="#D97706"/>
    <!-- Casing Panel Lines & Rivets -->
    <line x1="120" y1="30" x2="120" y2="90" stroke="#0C2037" stroke-width="2"/>
    <line x1="170" y1="30" x2="170" y2="90" stroke="#0C2037" stroke-width="2"/>
    <line x1="220" y1="30" x2="220" y2="90" stroke="#0C2037" stroke-width="2"/>
  </g>
  <!-- Technical Overlay HUD Graphics -->
  <g opacity="0.65">
    <path d="M 40,40 L 60,40" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 40,40 L 40,60" stroke="#38BDF8" stroke-width="2"/>
    <text x="70" y="45" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">EO/IR 4K GIMBAL • FLIR-9</text>
    <path d="M 360,40 L 340,40" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 360,40 L 360,60" stroke="#38BDF8" stroke-width="2"/>
  </g>
  <!-- Label -->
  <rect x="110" y="222" width="180" height="22" rx="11" fill="#0F2942" stroke="#2563EB" stroke-width="1"/>
  <text x="200" y="237" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ELECTRO-OPTICAL SENSOR</text>
</svg>
