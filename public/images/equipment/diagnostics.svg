<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1E33"/>
      <stop offset="100%" stop-color="#05101C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#diagBg)"/>
  <!-- Rugged Handheld Diagnostic Terminal -->
  <g transform="translate(70, 45)">
    <!-- Shockproof Rubberized Casing -->
    <rect x="30" y="10" width="180" height="155" rx="16" fill="#172B45" stroke="#2563EB" stroke-width="3"/>
    <!-- Corner Bumpers -->
    <rect x="25" y="8" width="20" height="16" rx="4" fill="#0C2037"/>
    <rect x="195" y="8" width="20" height="16" rx="4" fill="#0C2037"/>
    <rect x="25" y="151" width="20" height="16" rx="4" fill="#0C2037"/>
    <rect x="195" y="151" width="20" height="16" rx="4" fill="#0C2037"/>
    <!-- High-Resolution LCD Test Screen -->
    <rect x="45" y="25" width="150" height="90" rx="8" fill="url(#screenGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Real-time Oscilloscope / Borescope Waveform -->
    <path d="M 55,75 Q 70,35 85,75 T 115,75 T 140,50 T 160,95 T 185,75" fill="none" stroke="#059669" stroke-width="2.2"/>
    <line x1="55" y1="75" x2="185" y2="75" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5"/>
    <!-- Screen Header Metrics -->
    <text x="55" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DIAGNOSTIC CALIBRATOR</text>
    <text x="145" y="42" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PASS 99.8%</text>
    <text x="55" y="105" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="8">SIG: 120.4 mV • ZERO-DRIFT OK</text>
    <!-- Keypad & Nav Pad -->
    <circle cx="160" cy="140" r="14" fill="#0A182A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="160" cy="140" r="4" fill="#2563EB"/>
    <rect x="55" y="128" width="22" height="10" rx="3" fill="#2563EB"/>
    <rect x="83" y="128" width="22" height="10" rx="3" fill="#059669"/>
    <rect x="111" y="128" width="22" height="10" rx="3" fill="#D97706"/>
    <rect x="55" y="142" width="22" height="10" rx="3" fill="#0C2037" stroke="#38BDF8" stroke-width="0.8"/>
    <rect x="83" y="142" width="22" height="10" rx="3" fill="#0C2037" stroke="#38BDF8" stroke-width="0.8"/>
    <rect x="111" y="142" width="22" height="10" rx="3" fill="#0C2037" stroke="#38BDF8" stroke-width="0.8"/>
    <!-- Optical Fiber Borescope Flexible Cable Attachment -->
    <path d="M 210,80 Q 255,80 260,110 T 240,140 T 270,165" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Optical Camera Probe Tip -->
    <rect x="268" y="160" width="14" height="22" rx="4" fill="#059669" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="275" cy="178" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Label -->
  <rect x="105" y="222" width="190" height="22" rx="11" fill="#0F2942" stroke="#2563EB" stroke-width="1"/>
  <text x="200" y="237" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">INSPECTION &amp; DIAGNOSTIC</text>
</svg>
