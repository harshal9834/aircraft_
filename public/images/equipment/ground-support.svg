<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="gseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E4963"/>
      <stop offset="50%" stop-color="#1B3550"/>
      <stop offset="100%" stop-color="#0F2942"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#gseBg)"/>
  <!-- Mobile Ground Cart / Liquid Chiller Unit -->
  <g transform="translate(60, 60)">
    <!-- Cart Main Enclosure -->
    <rect x="30" y="30" width="220" height="100" rx="12" fill="url(#chassisGrad)" stroke="#2563EB" stroke-width="2.5"/>
    <!-- Ventilation Louvers / Heat Radiator Grille -->
    <g fill="#071424" stroke="#1E3A8A" stroke-width="1">
      <rect x="45" y="45" width="70" height="70" rx="6"/>
      <line x1="50" y1="55" x2="110" y2="55" stroke="#38BDF8" stroke-width="2"/>
      <line x1="50" y1="65" x2="110" y2="65" stroke="#38BDF8" stroke-width="2"/>
      <line x1="50" y1="75" x2="110" y2="75" stroke="#38BDF8" stroke-width="2"/>
      <line x1="50" y1="85" x2="110" y2="85" stroke="#38BDF8" stroke-width="2"/>
      <line x1="50" y1="95" x2="110" y2="95" stroke="#38BDF8" stroke-width="2"/>
      <line x1="50" y1="105" x2="110" y2="105" stroke="#38BDF8" stroke-width="2"/>
    </g>
    <!-- Pressure Gauges & Digital Readout Panel -->
    <rect x="130" y="45" width="105" height="40" rx="6" fill="#091B2E" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="152" cy="65" r="12" fill="#0C2037" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="152" y1="65" x2="159" y2="60" stroke="#059669" stroke-width="2"/>
    <circle cx="152" cy="65" r="2.5" fill="#059669"/>
    <circle cx="182" cy="65" r="12" fill="#0C2037" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="182" y1="65" x2="187" y2="58" stroke="#D97706" stroke-width="2"/>
    <circle cx="182" cy="65" r="2.5" fill="#D97706"/>
    <rect x="202" y="55" width="25" height="20" rx="3" fill="#06121E" stroke="#059669" stroke-width="1"/>
    <text x="214" y="69" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">BAR</text>
    <!-- Heavy Duty Wheels / Casters -->
    <circle cx="65" cy="135" r="18" fill="#172B45" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="65" cy="135" r="8" fill="#091B2E" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="215" cy="135" r="18" fill="#172B45" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="215" cy="135" r="8" fill="#091B2E" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Heavy Duty High-Pressure Coolant Hose -->
    <path d="M 230,105 Q 265,100 270,125 T 260,150" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="260" cy="150" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Tow Hitch Handle -->
    <path d="M 30,85 L 5,95" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="5" cy="95" r="4" fill="#E2E8F0"/>
  </g>
  <!-- Label -->
  <rect x="110" y="222" width="180" height="22" rx="11" fill="#0F2942" stroke="#2563EB" stroke-width="1"/>
  <text x="200" y="237" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">GROUND SUPPORT / CHILLER</text>
</svg>
